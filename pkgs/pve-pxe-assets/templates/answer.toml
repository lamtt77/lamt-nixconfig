[global]
keyboard = "en-us"
country = "us"
fqdn = "@HOSTNAME@.lamhub.com"
mailto = "lam@lamhub.com"
timezone = "@TIMEZONE@"
root_password = "@ROOT_PASSWORD@"
root-ssh-keys = [ "@SSH_PUBKEY@" ]

[disk-setup]
filesystem = "zfs"
disk-list = [ @DISK_LIST@ ]
zfs.ashift = 12
zfs.raid = "@ZFS_RAID@"
@DISK_FILTERS@

[network]
@NETWORK_CONFIG@

[first-boot]
source = "from-url"
ordering = "network-online"
url = "@FIRST_BOOT_URL@"
