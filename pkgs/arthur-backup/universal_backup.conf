# @author: LamT - lamtt77@gmail.com
#
## Tips: To list only rclone tasks on vim :g/^rclone/p or clean view without comment :v/^#/p
# Not enough? :enew! | exe 'r !./arthur_universal_backup -v' | silent! v/^daily/d
# Press Ctrl-T to see restic progress if it backing up huge files (SIGINFO / SIGUSR1)
#
# In general the use of --files-from is not recommended because it required to look at other file
# unless your backup files locate in many fragmented places

# note: add keyword 'export' to env if need be, config section always get executed
[config]
# KEEP_LAST   = ""
# KEEP_HOURLY = "8"
KEEP_DAILY    = "7"
KEEP_WEEKLY   = "4"
KEEP_MONTHLY  = "12"
KEEP_YEARLY   = "10"
# KEEP_WITHIN = ""
# KEEP_TAG    = ""

export RESTIC_PROGRESS_FPS = 0.00333 # 1 for an update every second, so 1/60/5 for every 5-minute
export RCLONE_STATS        = '5m'		 # same 5-minute stats update for rclone
export RCLONE_EXCLUDE_FROM = './rclone-exclude.txt'
export RCLONE_BWLIMIT      = '08:00,20M:100M 23:30,off'

BORG_REPO           = ${DATA_DIR}/borg-repo-arthur
RESTIC_VNO_REPO     = 'rclone:vnodrive:/restic-vnorepo'
RESTIC_FCM_VNO_REPO = 'rclone:vnodrive:/restic-fcmrepo'
RESTIC_AUO_REPO     = 'rclone:auodrive:/restic-auorepo'

## pre processing before actual backup tasks
[daily]
custom cp -v ${BACKUP_DIR}/gitea/teadump-daily-$(date +%a).zip ${BACKUP_DIR}/gitea-daily/teadump-daily.zip

[daily]
# borg			      repo					                        backup source --exclude
# The '{hostname}-' prefix is very important to limit prune's operation to this machine's archives
borg create		    ${BORG_REPO}::'{hostname}-mnt-{now}'	${BACKUP_DIR} --exclude "${BACKUP_DIR}/gitea/**"
borg prune		    ${BORG_REPO} --prefix '{hostname}-mnt'

# restic		      repo					                        backup source --exclude or --files-from
restic backup	    -r ${RESTIC_VNO_REPO}			            ${BACKUP_DIR} --exclude "${BACKUP_DIR}/gitea/**"
restic forget     --prune	-r ${RESTIC_VNO_REPO}
restic backup	    -r rclone:lamusgcrypt:restic-usgrepo	${BACKUP_DIR} --exclude "${BACKUP_DIR}/gitea/**"
restic forget     --prune	-r rclone:lamusgcrypt:restic-usgrepo

# rclone-push 		source					                      remote destination
rclone sync		    ${DATA_DIR}/backup-bin			          auodrive:/backup-bin
rclone sync		    ${DATA_DIR}/borg-repo-arthur		      lamodrive:/borg-repo-arthur
rclone sync		    ${DATA_DIR}/borg-repo-arthur		      lamdrop:/borg-repo-arthur
rclone sync		    ${BACKUP_DIR}				                  auocrypt:/Backup
#rclone sync 		  ${BACKUP_DIR}				                  lamdropcrypt:/Backup
# rclone-pull
rclone sync		    lamodrive:/Pictures			              ${DATA_DIR}/OneDriveAll/Pictures

[weekly]
restic check	    -r ${RESTIC_VNO_REPO}
restic check	    -r ${RESTIC_FCM_VNO_REPO}
restic check	    -r ${RESTIC_AUO_REPO}
restic check	    -r rclone:lamusgcrypt:restic-usgrepo

rclone check	    ${DATA_DIR}/backup-bin/			          auodrive:/backup-bin
rclone check	    ${DATA_DIR}/borg-repo-arthur		      lamodrive:/borg-repo-arthur
rclone check	    ${DATA_DIR}/borg-repo-arthur		      lamdrop:/borg-repo-arthur
rclone cryptcheck	${BACKUP_DIR}				                  auocrypt:/Backup/
#rclone cryptcheck	${BACKUP_DIR}				                lamdropcrypt:/Backup/
rclone check	    ${DATA_DIR}/Focus/fcms3backupbucket/	auodrive:/s3-fcmKT/fcms3backupbucket
rclone check	    ${DATA_DIR}/OneDriveAll/LamHistoryBk/	auodrive:/LamBk
# apparently, borg check will modify the file 'nonce', therefore this needs to perform last
borg check		    ${DATA_DIR}/borg-repo-arthur

## MONTHLY essential data integrity long check
[monthly]
restic check		  -r ${RESTIC_VNO_REPO}	                    --read-data
restic check		  -r rclone:lamusgcrypt:restic-usgrepo      --read-data
rclone check		  ${BACKUP_DIR}				auocrypt:/Backup/     --download
# rclone check		${BACKUP_DIR}				lamdropcrypt:/Backup/ --download
# borg check will have to perform last
borg check		    ${DATA_DIR}/borg-repo-arthur		          --verify-data

## QUARTERLY full data integrity long check
[quarterly]
restic check		  -r ${RESTIC_VNO_REPO}			                --read-data
restic check		  -r rclone:lamusgcrypt:restic-usgrepo      --read-data
restic check		  -r ${RESTIC_FCM_VNO_REPO}		              --read-data
restic check		  -r ${RESTIC_AUO_REPO}			                --read-data

rclone check		  ${BACKUP_DIR}				auocrypt:/Backup/     --download
# rclone check		${BACKUP_DIR}				lamdropcrypt:/Backup/ --download
# borg check will have to perform last
borg check		    ${DATA_DIR}/borg-repo-arthur		          --verify-data

[yearly]
custom echo "Nothing in yearly for now!"

## ONESHOT on-demand
[once]
rclone sync		    ${DATA_DIR}/OneDriveAll/LamHistoryBk/	auodrive:/LamBk

restic backup		  -r ${RESTIC_AUO_REPO}			            ${DATA_DIR}/Stocks/
restic forget     --prune	-r ${RESTIC_AUO_REPO}

restic backup		  -r ${RESTIC_FCM_VNO_REPO}		          ${DATA_DIR}/Focus/
restic forget     --prune	-r ${RESTIC_FCM_VNO_REPO}

## ADHOC for special sync/backup tasks needed special review before allowed to run
[adhoc]
# Pictures: always exclude latest year to prevent most recent photos accidentally removed
# this would only be allowed to run when I manually add/edit/remove photos, should first test with -v (dry-run)
rclone sync		    ${DATA_DIR}/OneDriveAll/Pictures/	    lamodrive:/Pictures --exclude="$(date +%Y)/"

## Post processing or clean up, should be kept at the end, note that any sections can be re-used
[daily]
custom echo "Hey, post processing here, extra clean up tasks can still add here if need be!"
