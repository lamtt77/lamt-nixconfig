[package]
name = "nxd"
version = "0.1.0"
edition = "2024"
default-run = "nxd"

[dependencies]
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
indicatif = "0.17"
dialoguer = "0.11"
log = "0.4"
env_logger = "0.10"
