dir: local
	path /var/lib/vz
	content vztmpl,iso,backup

zfspool: local-zfs
	pool rpool/data
	content rootdir,images
	sparse 1

nfs: arthurz2-nfs
	export /mnt/arthur_z2/VM
	path /mnt/pve/arthurz2-nfs
	server 192.168.1.6
	content rootdir,images
	prune-backups keep-all=1

nfs: arthurz2-dir
	export /mnt/arthur_z2/Boot/ISO
	path /mnt/pve/arthurz2-dir
	server 192.168.1.6
	content snippets,backup,iso,vztmpl
	prune-backups keep-all=1

lvm: arthurz2-lvm
	vgname fcvg-z2-shared
	content rootdir,images
	saferemove 0
	shared 1
	snapshot-as-volume-chain 1

