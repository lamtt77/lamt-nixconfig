baseURL = "https://blog.lamhub.com"
locale = "en-us"
title = "LamT's Blog"
theme = "hugo-papermod"

[params]
  author = "LamT"
  description = "A simple blog"

  # PaperMod specific params
  ShowReadingTime = true
  ShowShareButtons = true
  # Share buttons under each post, limited to the three networks worth
  # sharing to. PaperMod otherwise renders seven, including WhatsApp and
  # Telegram, which are noise for this audience.
  ShareButtons = ["x", "linkedin", "reddit"]

  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  defaultTheme = "auto"  # auto, light, dark

  [params.assets]
    disableHLJS = false
    # Fingerprint asset filenames. Without this the stylesheet is always
    # /assets/css/stylesheet.css, so a CSS change keeps its old URL and the CDN
    # keeps serving the cached copy (max-age 14400) against freshly deployed
    # HTML. A content hash in the name makes every change a new URL.
    disableFingerprinting = false

  [params.label]
    text = "Home"
    # icon = "/apple-touch-icon.png"
    iconHeight = 35

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/lamtt77"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/lamtt77"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/lamtt77"
  [[params.socialIcons]]
    name = "reddit"
    url = "https://reddit.com/user/lamtt77"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

