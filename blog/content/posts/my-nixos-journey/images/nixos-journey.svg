<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Path: Chaos to Order -->
  <path d="M 100 300 Q 250 300 300 200 T 500 200 T 700 100" fill="none" stroke="#414868" stroke-width="4" stroke-dasharray="10 10"/>

  <!-- Arch (Represented) -->
  <g transform="translate(150, 250)">
    <path d="M0,-40 L-30,20 L30,20 Z" fill="none" stroke="#1793d1" stroke-width="4"/>
    <text x="0" y="50" font-family="sans-serif" fill="#1793d1" text-anchor="middle" font-size="14">Imperative</text>
  </g>

  <!-- FreeBSD (Represented) -->
  <g transform="translate(300, 150)">
    <circle r="30" fill="none" stroke="#ab2b28" stroke-width="4"/>
    <text x="0" y="60" font-family="sans-serif" fill="#ab2b28" text-anchor="middle" font-size="14">Stable</text>
  </g>

  <!-- NixOS (The Goal) -->
  <g transform="translate(550, 200)">
    <!-- Hexagon structure -->
    <path d="M30,-52 L60,0 L30,52 L-30,52 L-60,0 L-30,-52 Z" fill="#5277C3" opacity="0.2"/>
    <path d="M0,-40 L35,-20 L35,20 L0,40 L-35,20 L-35,-20 Z" fill="none" stroke="#7EB6E1" stroke-width="5" filter="url(#glow)"/>
    <path d="M0,-40 L0,-25 M35,-20 L20,-10 M35,20 L20,10 M0,40 L0,25 M-35,20 L-20,10 M-35,-20 L-20,-10" stroke="#7EB6E1" stroke-width="3"/>
    
    <text x="0" y="90" font-family="sans-serif" font-weight="bold" fill="#fff" text-anchor="middle" font-size="24">NixOS</text>
    <text x="0" y="115" font-family="sans-serif" fill="#7EB6E1" text-anchor="middle" font-size="14">Declarative</text>
  </g>
</svg>